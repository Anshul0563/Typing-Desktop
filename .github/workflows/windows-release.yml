name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Run tests
        run: npm test

      - name: Build installer and portable executable
        run: npm run dist:win

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/SAS-Academy-Typing-Setup-1.0.0.exe" `
            "release/SAS-Academy-Typing-Portable-1.0.0.exe" `
            --title "SAS Academy Typing ${{ github.ref_name }}" `
            --generate-notes
